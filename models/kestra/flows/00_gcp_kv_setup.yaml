id: gcp_kv_setup
namespace: youtube.setup

tasks:
  - id: set_project_id
    type: io.kestra.plugin.core.kv.Set
    key: GCP_PROJECT_ID
    value: "your-project-id"  # ← Replace with your GCP project ID

  - id: set_gcs_bucket
    type: io.kestra.plugin.core.kv.Set
    key: GCS_BUCKET
    value: "your-bucket-name"  # ← Replace with your GCS bucket

  - id: set_bq_dataset
    type: io.kestra.plugin.core.kv.Set
    key: BQ_DATASET
    value: "youtube_trending_data"

  - id: set_gcp_creds
    type: io.kestra.plugin.core.kv.Set
    key: GCP_CREDS
    value: |
      # Paste your service account JSON here
      # NEVER commit real credentials to Git!
